[project]
name = "media-inspector"
version = "0.1.0"
description = "Yet Another Media Inspector tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "imagehash>=4.3.2",
    "numpy>=1.22.0",
    "opencv-python-headless>=4.13.0.92",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pillow>=12.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.29",
    "tqdm>=4.67.3",
    "uvicorn[standard]>=0.48.0",
    "vercel_blob>=0.4.2",
]

[tool.vercel]
entrypoint = "app:app"
